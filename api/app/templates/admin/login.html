<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 50%, #1a0f0a 100%);
            position: relative;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(184, 134, 11, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(184, 134, 11, 0.02) 0%, transparent 40%);
            animation: shimmer 15s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-2%, 1%) rotate(1deg); }
        }
        .login-card {
            background: rgba(30, 20, 15, 0.95);
            border: 1px solid rgba(184, 134, 11, 0.15);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(184, 134, 11, 0.05) inset;
            backdrop-filter: blur(20px);
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .login-logo svg { color: #b8860b; }
        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #f5e6c8;
            font-weight: 600;
            text-align: center;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: rgba(245, 230, 200, 0.4);
            text-align: center;
            margin-top: 4px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: rgba(245, 230, 200, 0.6);
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(184, 134, 11, 0.15);
            border-radius: 8px;
            color: #f5e6c8;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(184, 134, 11, 0.4);
            background: rgba(184, 134, 11, 0.05);
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.05);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b8860b, #d4a017);
            border: none;
            border-radius: 8px;
            color: #1a0f0a;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #d4a017, #e8b828);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.25);
        }
        .login-btn:active { transform: translateY(0); }
        .login-error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            color: #fca5a5;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="admin-body">
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2C6 2 4 8 4 12c0 4 2 8 8 10 6-2 8-6 8-10 0-4-2-10-8-10z"/>
                    <path d="M12 22V10"/>
                    <path d="M8 6c2 2 6 2 8 0"/>
                </svg>
                <div class="login-title">Cigar Lounge</div>
                <div class="login-subtitle">Admin Panel</div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="login-error">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
