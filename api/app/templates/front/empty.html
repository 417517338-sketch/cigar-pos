{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="page-title">Settings</div>

<form method="POST">
    <div class="card mb-24">
        <h3 style="margin-bottom:16px">Shop Info</h3>
        <div class="form-group">
            <label class="form-label">Shop Name</label>
            <input type="text" class="form-control" name="shop_name" value="{{ shop_name }}" maxlength="128">
        </div>
    </div>

    <div class="card mb-24">
        <h3 style="margin-bottom:16px">Profit Calculation</h3>
        <div class="form-group">
            <label class="form-label">Monthly Operational Cost (¥)</label>
            <input type="number" step="0.01" class="form-control" name="operational_cost" value="{{ operational_cost }}" placeholder="Rent, utilities, salaries, etc.">
            <div class="form-help text-muted" style="font-size:0.8rem;margin-top:4px">This cost will be deducted from gross profit to calculate net profit</div>
        </div>
    </div>

    <div class="card mb-24">
        <h3 style="margin-bottom:16px">Receipt Printer</h3>
        <div class="form-group">
            <label class="form-label">Bluetooth Printer</label>
            <div class="flex gap-8">
                <button type="button" class="btn btn-ghost" onclick="scanPrinter()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 000 20M2 12h20"/></svg>
                    Scan for Devices
                </button>
            </div>
            <div id="printerStatus" class="text-muted mt-8" style="font-size:0.85rem">No printer paired</div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Settings</button>
</form>

<script>
function scanPrinter() {
    document.getElementById('printerStatus').textContent = 'Scanning...';
    if (navigator.bluetooth) {
        navigator.bluetooth.requestDevice({filters:[{services:['00001101-0000-1000-8000-00805f9b34fb']}]})
            .then(d => document.getElementById('printerStatus').textContent = 'Paired: ' + d.name)
            .catch(e => document.getElementById('printerStatus').textContent = 'Pairing failed: ' + e.message);
    } else {
        document.getElementById('printerStatus').textContent = 'Bluetooth not available on this device';
    }
}
</script>
{% endblock %}
