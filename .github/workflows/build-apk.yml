name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install
        working-directory: webapp

      - name: Build web app
        run: |
          npm run build
          echo "=== dist contents ===" && ls -la dist/
        working-directory: webapp

      - name: Sync Capacitor
        run: |
          echo "=== android exists? ===" && ls -d android && echo "yes" || echo "no"
          npx cap sync android 2>&1
          echo "=== sync done ===" && ls android/app/src/main/assets/public/ 2>/dev/null | head -5
        working-directory: webapp

      - name: Build APK
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          echo "=== java version ===" && java -version 2>&1
          echo "=== ANDROID_HOME ===" && echo $ANDROID_HOME
          echo "=== gradle files ===" && ls android/gradle* android/build.gradle 2>/dev/null
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50
        working-directory: webapp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cigar-pos-apk
          path: webapp/android/app/build/outputs/apk/debug/*.apk
