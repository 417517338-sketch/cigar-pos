name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip
          java -version 2>&1

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          curl -sL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

      - name: Download Gradle
        run: |
          export GRADLE_HOME=/opt/gradle
          mkdir -p $GRADLE_HOME
          curl -sL -o /tmp/gradle-8.2.zip "https://mirrors.aliyun.com/gradle/gradle-8.2-bin.zip"
          unzip -q /tmp/gradle-8.2.zip -d $GRADLE_HOME
          echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$GRADLE_HOME/gradle-8.2/bin" >> $GITHUB_ENV
          gradle --version

      - name: Install web deps and build
        run: |
          npm install
          npm run build
        working-directory: webapp

      - name: Copy web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          ls android/app/src/main/assets/public/
        working-directory: webapp

      - name: Build APK
        run: |
          export ANDROID_HOME=/opt/android-sdk
          export ANDROID_SDK_ROOT=/opt/android-sdk
          gradle assembleDebug --no-daemon -p android 2>&1
        working-directory: webapp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cigar-pos-apk
          path: android/app/build/outputs/apk/debug/*.apk
